[project]
name = "papertrail"
version = "0.1.0"
description = "PDF Q&A with verifiable, page-level citations (hand-rolled RAG)"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24",
    "chromadb>=0.5",
    "openai>=1.40",
    "gradio>=5.0",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "langchain-openai>=0.2", "langchain-community<0.4"]
langchain = [
    "langchain-core>=0.3",
    "langchain-community>=0.3",
    "langchain-chroma>=0.1",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "langchain-text-splitters>=0.3",
    "sentence-transformers>=3.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["papertrail", "langchain_impl"]
